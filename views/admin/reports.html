<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transalca Admin | Reportes</title>
    <link rel="icon" type="image/png" href="/public/img/transalca-logo.png">
    <link href="/public/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/public/bootstrap/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/public/css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebarContainer"></div>
        <div class="main-content">
            <div id="navbarContainer"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Reportes</h4>
                    <button class="btn btn-primary" onclick="openExportModal()"><i class="bi bi-download me-2"></i>Exportar Reporte</button>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <form id="filterForm" class="row g-3 align-items-end">
                            <div class="col-md-2" id="startDateContainer">
                                <label class="form-label text-muted small mb-1">Fecha Inicio</label>
                                <input type="date" class="form-control form-control-sm" id="startDate" name="startDate">
                            </div>
                            <div class="col-md-2" id="endDateContainer">
                                <label class="form-label text-muted small mb-1">Fecha Fin</label>
                                <input type="date" class="form-control form-control-sm" id="endDate" name="endDate">
                            </div>
                            <div class="col-md-2" id="categoryFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Categoría</label>
                                <select class="form-select form-select-sm" id="categoryFilter" name="category">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="brandFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Marca</label>
                                <select class="form-select form-select-sm" id="brandFilter" name="brand">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="statusFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1" id="statusLabel">Estado</label>
                                <select class="form-select form-select-sm" id="status" name="status">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="paymentMethodFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Método Pago</label>
                                <select class="form-select form-select-sm" id="paymentMethodFilter" name="payment_method">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="clientTypeFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Tipo Cliente</label>
                                <select class="form-select form-select-sm" id="clientTypeFilter" name="client_type">
                                    <option value="">Todos</option>
                                    <option value="natural">Natural</option>
                                    <option value="juridica">Jurídica / Empresa</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="monedaFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Moneda</label>
                                <select class="form-select form-select-sm" id="monedaFilter" name="moneda">
                                    <option value="">Todas</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="VES">VES (Bs)</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="stockStatusFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Nivel Stock</label>
                                <select class="form-select form-select-sm" id="stockStatusFilter" name="stock_status">
                                    <option value="">Todos</option>
                                    <option value="in_stock">En Stock</option>
                                    <option value="low_stock">Stock Bajo (Alerta)</option>
                                    <option value="out_of_stock">Sin Stock (Agotado)</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="mechanicFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Mecánico</label>
                                <select class="form-select form-select-sm" id="mechanicFilter" name="mechanic_cedula">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="sucursalFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Sucursal</label>
                                <select class="form-select form-select-sm" id="sucursalFilter" name="sucursal_id">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="limitFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Mostrar Top</label>
                                <select class="form-select form-select-sm" id="limitFilter" name="limit">
                                    <option value="5">Top 5</option>
                                    <option value="10" selected>Top 10</option>
                                    <option value="25">Top 25</option>
                                    <option value="50">Top 50</option>
                                    <option value="0">Todos</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="orderByFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Ordenar por</label>
                                <select class="form-select form-select-sm" id="orderByFilter" name="order_by">
                                    <option value="units" selected>Mayor Cantidad (Uds)</option>
                                    <option value="revenue">Mayor Ingreso ($)</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="accionFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Acción</label>
                                <select class="form-select form-select-sm" id="accionFilter" name="accion_tipo">
                                    <option value="">Todas</option>
                                    <option value="CREAR">CREAR</option>
                                    <option value="MODIFICAR">MODIFICAR</option>
                                    <option value="ELIMINAR">ELIMINAR</option>
                                    <option value="LOGIN">LOGIN</option>
                                    <option value="LOGOUT">LOGOUT</option>
                                    <option value="LEER">LEER</option>
                                    <option value="aceptado">ACEPTADO</option>
                                    <option value="rechazado">RECHAZADO</option>
                                </select>
                            </div>
                            <div class="col-md-2" id="searchFilterContainer" style="display:none;">
                                <label class="form-label text-muted small mb-1">Búsqueda</label>
                                <input type="text" class="form-control form-control-sm" id="searchFilter" placeholder="Buscar..." onkeypress="if(event.key==='Enter'){event.preventDefault();loadReportData();}">
                            </div>
                            <div class="col-md-2" id="filterBtnContainer">
                                <button type="button" class="btn btn-dark w-100 report-filter-button" onclick="loadReportData()"><i class="bi bi-funnel me-2"></i>Filtrar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="report-tabs" id="reportTabs">
                    <div class="report-tab active" data-report="sales" onclick="switchReport('sales', this)">Reporte Orden de Venta</div>
                    <div class="report-tab" data-report="top_products" onclick="switchReport('top_products', this)">Productos Más Vendidos</div>
                    <div class="report-tab" data-report="payments" onclick="switchReport('payments', this)">Flujo de Pagos</div>
                    <div class="report-tab" data-report="inventory" onclick="switchReport('inventory', this)">Kardex de Stock</div>
                    <div class="report-tab" data-report="mechanics" onclick="switchReport('mechanics', this)">Desempeño Mecánicos</div>
                    <div class="report-tab" data-report="bitacora" onclick="switchReport('bitacora', this)">Auditoría de Bitácora</div>
                </div>
                
                <div class="alert alert-info py-2 px-3 small mb-3 animate-fade-in" id="reportDescription" style="border-left: 4px solid var(--primary); background: var(--primary-soft); color: var(--text-dark); border-top: none; border-right: none; border-bottom: none; border-radius: 4px;">
                    Cargando descripción...
                </div>

                <div class="card">
                    <div class="card-body p-0 table-responsive">
                        <table class="table mb-0" id="reportTable" data-no-auto-search="1">
                            <thead id="reportHead"></thead>
                            <tbody id="reportBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Exportar Datos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="text-muted small mb-3">Descargar el reporte actual aplicado a los filtros de fecha y estatus seleccionados.</p>
                    <div class="d-grid gap-2">
                        <button class="btn btn-danger text-start" onclick="triggerDownload('pdf')"><i class="bi bi-file-earmark-pdf-fill me-2"></i> Documento PDF</button>
                        <button class="btn btn-success text-start" onclick="triggerDownload('excel')"><i class="bi bi-file-earmark-excel-fill me-2"></i> Hoja de Excel (.xlsx)</button>
                        <button class="btn btn-secondary text-start" onclick="triggerDownload('csv')"><i class="bi bi-filetype-csv me-2"></i> Archivo CSV Plano</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/public/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/public/jquery/jquery.min.js"></script>
    <script src="/public/js/admin_common.js"></script>
    <script src="/public/js/reports.js"></script>
</body>
</html>
