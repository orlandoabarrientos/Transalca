<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - TRANSALCA</title>
    <link rel="icon" type="image/png" href="/public/img/transalca-logo.png">
    <link href="/public/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/public/bootstrap/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/public/sweetalert2/sweetalert2.min.css" rel="stylesheet">
    <link href="/public/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="brand-title">
            <h2>TRANSALCA</h2>
            <p>Restablecer contraseña</p>
        </div>
        <form id="resetForm" novalidate>
            <input type="hidden" id="resetToken" name="token">
            <div class="mb-3">
                <label class="form-label" for="resetPassword">Nueva Contraseña <span class="required">*</span></label>
                <div class="input-group auth-password-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="resetPassword" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                    <button class="btn auth-password-toggle" type="button" id="toggleResetPassword" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback"></div>
                <small class="form-text text-muted reset-password-hint" style="font-size:0.78rem;">Mínimo 8 caracteres, 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial (@$!%*?&#.).</small>
            </div>
            <div class="mb-4">
                <label class="form-label" for="resetConfirmPassword">Confirmar Contraseña <span class="required">*</span></label>
                <div class="input-group auth-password-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" id="resetConfirmPassword" name="confirm_password" placeholder="Repita la nueva contraseña" required autocomplete="new-password">
                    <button class="btn auth-password-toggle" type="button" id="toggleResetConfirmPassword" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn-login mb-3" id="btnSubmitReset">Restablecer contraseña</button>
            <p class="text-center" style="font-size:0.85rem;color:var(--text-secondary);">
                <a href="/auth/login" style="color:var(--primary);font-weight:600;"><i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión</a>
            </p>
        </form>
    </div>
</div>
<script src="/public/jquery/jquery.min.js"></script>
<script src="/public/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/public/sweetalert2/sweetalert2.all.min.js"></script>
<script src="/public/js/admin_common.js"></script>
<script src="/public/js/auth.js"></script>
</body>
</html>
